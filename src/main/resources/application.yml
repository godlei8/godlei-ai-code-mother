spring:
  application:
    name: godlei-ai-code-mother-backend
    # mysql
  session:
    store-type: redis
    # 30天过期
    timeout: 2592000
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/godlei_ai_code_mother
    username: root
    password: aa642353
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi项目配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.godlei.godleiaicodemother.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: cos.godlei8.top
    secretId: <you id>
    secretKey: <you key>
    region: ap-chengdu
    bucket: godlei-1311686380
langchain4j:
  open-ai:
    chat-model:
     api-key: <你的key>
     model-name: deepseek-v4-flash
     log-requests: true
     log-responses: true
     base-url: https://api.deepseek.com
     max-tokens: 10000
     strict-json-schema: true
     response-format: json_object
    streaming-chat-model:
        api-key: <你的key>
        model-name: deepseek-v4-flash
        log-requests: true
        log-responses: true
        base-url: https://api.deepseek.com
        max-tokens: 10000
      # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
        base-url: https://api.deepseek.com
        api-key: <你的key>
        model-name: deepseek-v4-flash
        max-tokens: 32768
        temperature: 0.1
        log-requests: true
        log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://api.deepseek.com
      api-key: <你的key>
      model-name: deepseek-v4-flash
      max-tokens: 1000
      temperature: 0.1
      log-requests: true
      log-responses: true
    image-chat-model:
      base-url: https://api.deepseek.com
      api-key: <你的key>
      model-name: deepseek-v4-flash
      max-tokens: 10000
      temperature: 0.1
      log-requests: true
      log-responses: true
# Pexels 图片搜索配置
pexels:
  api-key: <你的key>
# 阿里云 DashScope 配置
dashscope:
  api-key: <Your API Key>
  image-model: qwen-image-2.0